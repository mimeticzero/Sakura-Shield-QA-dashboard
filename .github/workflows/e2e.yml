name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          FIDELITY_URL:         ${{ secrets.FIDELITY_URL }}
          FIDELITY_TEST_EMAIL:  ${{ secrets.FIDELITY_TEST_EMAIL }}
          FIDELITY_TEST_PASS:   ${{ secrets.FIDELITY_TEST_PASS }}
          REWARDS_URL:          ${{ secrets.REWARDS_URL }}
          REWARDS_TEST_TOKEN:   ${{ secrets.REWARDS_TEST_TOKEN }}
          XIAN_URL:             ${{ secrets.XIAN_URL }}
          THE_ACCUSED_URL:      ${{ secrets.THE_ACCUSED_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test-results/results.json
            test-results/history.json
          retention-days: 30
