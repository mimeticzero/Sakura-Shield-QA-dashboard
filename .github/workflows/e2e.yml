name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps only
        run: npx playwright install-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          FIDELITY_URL:         ${{ secrets.FIDELITY_URL }}
          FIDELITY_TEST_EMAIL:  ${{ secrets.FIDELITY_TEST_EMAIL }}
          FIDELITY_TEST_PASS:   ${{ secrets.FIDELITY_TEST_PASS }}
          REWARDS_URL:          ${{ secrets.REWARDS_URL }}
          REWARDS_TEST_TOKEN:   ${{ secrets.REWARDS_TEST_TOKEN }}
          XIAN_URL:             ${{ secrets.XIAN_URL }}
          THE_ACCUSED_URL:      ${{ secrets.THE_ACCUSED_URL }}
          PERCY_TOKEN:          ${{ secrets.PERCY_TOKEN }}

      - name: Update history.json
        if: always()
        run: |
          node -e "
          const fs = require('fs');

          // results.json may not exist if tests crashed before writing
          if (!fs.existsSync('test-results/results.json')) {
            console.log('No results.json found, skipping history update');
            process.exit(0);
          }

          const results = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
          const suites = results.suites ?? [];
          let passed = 0, failed = 0, total = 0;
          function walk(s) {
            (s.specs ?? []).forEach(spec => {
              spec.tests?.forEach(t => {
                total++;
                const ok = t.results?.some(r => r.status === 'passed');
                ok ? passed++ : failed++;
              });
            });
            (s.suites ?? []).forEach(walk);
          }
          suites.forEach(walk);
          const passRate = total > 0 ? Math.round((passed / total) * 100) : 0;
          const today = new Date().toISOString().slice(0, 10);
          const histPath = 'test-results/history.json';

          // Create history file if missing
          const hist = fs.existsSync(histPath)
            ? JSON.parse(fs.readFileSync(histPath, 'utf8'))
            : [];

          const last = hist[hist.length - 1];
          if (last?.date === today) {
            last.passRate = passRate; last.passed = passed; last.failed = failed; last.total = total;
          } else {
            hist.push({ date: today, passRate, passed, failed, total });
          }
          if (hist.length > 30) hist.splice(0, hist.length - 30);
          fs.writeFileSync(histPath, JSON.stringify(hist, null, 2));
          console.log('history updated:', today, passRate + '%');
          "

      - name: Commit test results to repo
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-results/results.json test-results/history.json test-results/a11y-results.json 2>/dev/null || true
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "ci: update test results [skip ci]"
          git push

      - name: Trigger SakuraNode dashboard sync
        if: always() && github.event_name != 'pull_request'
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_SAKURANODE }}" \
            https://api.github.com/repos/mimeticzero/sakuranode/dispatches \
            -d '{"event_type":"qa-results-updated"}'
        continue-on-error: true

      - name: Upload Playwright report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always() && github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: report
          commit_message: "ci: deploy Playwright report #${{ github.run_number }} [skip ci]"
