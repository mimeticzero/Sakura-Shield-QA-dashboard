name: Lighthouse Audit

on:
  push:
    branches: [main]
  schedule:
    # Every day at 03:00 UTC — keeps scores fresh without hammering prod
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lighthouse:
    name: Lighthouse — All Projects
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system deps
        run: npx playwright install-deps chromium

      - name: Run Lighthouse audit (all 4 apps)
        run: node tests/load/lighthouse-all.js
        env:
          SAKURA_NODE_URL: https://sakuranode.com
          FIDELITY_URL:    ${{ secrets.FIDELITY_URL }}
          REWARDS_URL:     ${{ secrets.REWARDS_URL }}
          XIAN_URL:        ${{ secrets.XIAN_URL }}
        continue-on-error: true

      - name: Commit Lighthouse results
        if: always()
        run: |
          if [ ! -f test-results/lighthouse-projects.json ]; then
            echo "No lighthouse-projects.json — skipping commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add test-results/lighthouse-projects.json
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "ci: update Lighthouse scores [skip ci]"
          git push

      - name: Trigger SakuraNode dashboard sync
        if: always()
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_SAKURANODE }}" \
            https://api.github.com/repos/mimeticzero/sakuranode/dispatches \
            -d '{"event_type":"qa-results-updated"}'
        continue-on-error: true

      - name: Upload Lighthouse JSON artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results-${{ github.run_number }}
          path: test-results/lighthouse-projects.json
          retention-days: 30
